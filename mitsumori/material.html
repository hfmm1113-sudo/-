<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資材各種詳細</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      font-family: "Noto Sans JP", sans-serif;
      background: #f8fbff;
      color: #111827;
      padding-bottom: 40px;
    }

    .material-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 32px;
    }

    .material-title {
      font-size: 2rem;
      font-weight: 800;
      border-left: 6px solid #159947;
      padding-left: 14px;
      margin-bottom: 12px;
    }

    .material-lead {
      color: #475569;
      margin-bottom: 28px;
    }

    .material-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
      padding: 24px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title i {
      color: #159947;
    }

    .search-box {
      max-width: 420px;
    }

    .table-material th {
      background: #eefaf2;
      color: #166534;
      white-space: nowrap;
      text-align: center;
      vertical-align: middle;
    }

    .table-material td {
      vertical-align: middle;
    }

    .code-cell {
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
    }

    .size-cell {
      white-space: nowrap;
    }

    .type-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: #eef5ff;
      color: #0d6efd;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .back-btn {
      border: 1px solid #159947;
      color: #159947;
      font-weight: 700;
    }

    .back-btn:hover {
      background: #159947;
      color: white;
    }

    @media (max-width: 576px) {
      .material-wrap {
        padding: 24px 14px;
      }

      .material-card {
        padding: 16px;
      }

      .material-title {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <main class="material-wrap">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="material-title">資材各種詳細</h1>
        <div class="material-lead">
          段ボールサイズ・袋サイズを確認できます。コードや名称で検索できます。
        </div>
      </div>

      <a href="index.html" class="btn back-btn">
        <i class="bi bi-house-door-fill"></i>
        TOPへ戻る
      </a>
    </div>

    <ul class="nav nav-tabs mb-3" id="materialTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="cardboard-tab" data-bs-toggle="tab"
                data-bs-target="#cardboardPane" type="button" role="tab">
          <i class="bi bi-box-seam"></i> 段ボールサイズ
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="bag-tab" data-bs-toggle="tab"
                data-bs-target="#bagPane" type="button" role="tab">
          <i class="bi bi-bag"></i> 袋サイズ
        </button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- 段ボール -->
      <section class="tab-pane fade show active material-card" id="cardboardPane" role="tabpanel">

        <div class="section-title">
          <i class="bi bi-box-seam"></i>
          段ボールサイズ一覧
        </div>

        <input type="text" id="cardboardSearch" class="form-control search-box mb-3"
               placeholder="コード・No・材質で検索 例：F10001、No.1、K5A">

        <div class="table-responsive">
          <table class="table table-bordered table-hover table-material">
            <thead>
              <tr>
                <th>コード</th>
                <th>サイズ名</th>
                <th>長さ</th>
                <th>幅</th>
                <th>高さ</th>
                <th>材質</th>
              </tr>
            </thead>
            <tbody id="cardboardBody"></tbody>
          </table>
        </div>

      </section>

      <!-- 袋 -->
      <section class="tab-pane fade material-card" id="bagPane" role="tabpanel">

        <div class="section-title">
          <i class="bi bi-bag"></i>
          袋サイズ一覧
        </div>

        <input type="text" id="bagSearch" class="form-control search-box mb-3"
               placeholder="コード・袋種類・サイズで検索 例：K11261、AL-9W、32+115">

        <div class="table-responsive">
          <table class="table table-bordered table-hover table-material">
            <thead>
              <tr>
                <th>タイプ</th>
                <th>コード</th>
                <th>袋種類</th>
                <th>サイズ</th>
                <th>袋重量（ｇ）</th>
              </tr>
            </thead>
            <tbody id="bagBody"></tbody>
          </table>
        </div>

      </section>

    </div>

  </main>

    function renderCardboards(keyword = "") {
      const tbody = document.getElementById("cardboardBody");
      const key = keyword.toLowerCase();

      const rows = CARDBOARDS.filter(item =>
        Object.values(item).join(" ").toLowerCase().includes(key)
      );

      tbody.innerHTML = rows.map(item => `
        <tr>
          <td class="code-cell">${item.code}</td>
          <td>${item.name}</td>
          <td class="text-end">${item.length}</td>
          <td class="text-end">${item.width}</td>
          <td class="text-end">${item.height}</td>
          <td>${item.material}</td>
        </tr>
      `).join("");
    }

    function renderBags(keyword = "") {
      const tbody = document.getElementById("bagBody");
      const key = keyword.toLowerCase();

      const rows = BAGS.filter(item =>
        Object.values(item).join(" ").toLowerCase().includes(key)
      );

      tbody.innerHTML = rows.map(item => `
        <tr>
          <td><span class="type-badge">${item.type}</span></td>
          <td class="code-cell">${item.code}</td>
          <td>${item.kind}</td>
          <td class="size-cell">${item.size}</td>
          <td class="text-end">${item.weight}</td>
        </tr>
      `).join("");
    }

    document.getElementById("cardboardSearch").addEventListener("input", e => {
      renderCardboards(e.target.value);
    });

    document.getElementById("bagSearch").addEventListener("input", e => {
      renderBags(e.target.value);
    });

    renderCardboards();
    renderBags();
  </script>
