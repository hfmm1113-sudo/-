<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>見積もりシステム</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/style.css">

  <!-- json追加 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    fetch("data/oshirase.json")
      .then(res => res.json())
      .then(data => {

        data.sort((a, b) => new Date(b.date) - new Date(a.date));

        const noticeList = document.getElementById("noticeList");

        const firstThree = data.slice(0, 3);
        const rest = data.slice(3);

        noticeList.innerHTML = `
      ${firstThree.map((item, index) => `
        <div class="row align-items-center py-3 border-bottom">
          <div class="col-auto"><span class="notice-dot"></span></div>
          <div class="col-md-2">${item.date}</div>
          <div class="col">${item.text}</div>
        </div>
      `).join("")}

      ${rest.length > 0 ? `
        <div class="collapse" id="moreNotice">
          ${rest.map((item, index) => `
            <div class="row align-items-center py-3 border-bottom">
              <div class="col-auto"><span class="notice-dot"></span></div>
              <div class="col-md-2">${item.date}</div>
              <div class="col">${item.text}</div>
            </div>
          `).join("")}
        </div>

        <div class="text-end pt-3">
          <button class="btn btn-link text-decoration-none"
                  type="button"
                  data-bs-toggle="collapse"
                  data-bs-target="#moreNotice">
            もっと見る
          </button>
        </div>
      ` : ""}
    `;
      });
  </script>
  <style>
    body {
      font-family: "Noto Sans JP", sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
      color: #111827;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    .top-navbar {
      height: 72px;
      background: #ffffff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    .brand-icon {
      font-size: 2rem;
      color: #0d6efd;
    }

    .main-wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 56px 32px;
    }

    .welcome-title {
      font-size: 2.6rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .welcome-text {
      font-size: 1.1rem;
      line-height: 1.9;
      color: #374151;
    }

    .menu-card {
      height: 230px;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      transition: 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
    }

    .menu-icon {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
    }

    .blue {
      color: #0d6efd;
      background: #eef5ff;
    }

    .green {
      color: #159947;
      background: #eefaf2;
    }

    .orange {
      color: #f28c00;
      background: #fff4e5;
    }

    .menu-title {
      font-size: 1.45rem;
      font-weight: 800;
    }

    .menu-desc {
      color: #4b5563;
      line-height: 1.8;
    }

    .arrow {
      font-size: 2rem;
    }

    .notice-card {
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      padding: 32px;
    }

    .notice-dot {
      width: 10px;
      height: 10px;
      background: #0d6efd;
      border-radius: 50%;
      display: inline-block;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #f8fafc;
      border-top: 1px solid #e5e7eb;
      padding: 18px 36px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <nav class="top-navbar">
    <div class="top-header-inner">

      <a href="index.html" class="top-logo">
        <img src="img/tk_logo.png" alt="TK製薬株式会社" style="height:60px;width:auto;">
      </a>

      <div class="top-user">
        <i class="bi bi-person"></i>
        <span>管理者</span>
        <i class="bi bi-chevron-down"></i>
      </div>

    </div>
  </nav>
  <main class="main-wrap">

    <section class="mb-5">
      <h2 class="welcome-title">ようこそ</h2>
      <p class="welcome-text">
        ご利用したいメニューを選択してください。<br>
        見積もりの作成や、資材の各種詳細の確認ができます。
      </p>
    </section>

    <section class="row g-4 mb-5">
 

        <!-- 見積もり作成 -->
        <div class="col-12 col-xl-4">
          <a href="mitsumori.html" class="menu-card p-4">
            <div class="d-flex align-items-center h-100">
              <div class="menu-icon blue me-4">
                <i class="bi bi-file-earmark-plus"></i>
              </div>

              <div class="flex-grow-1">
                <div class="menu-title text-primary mb-3">見積もり作成</div>
                <div class="menu-desc">
                  新しい見積もりを作成します。
                  各種資材の選択や仕様の入力が行えます。
                </div>
              </div>

              <div class="arrow text-primary">
                <i class="bi bi-chevron-right"></i>
              </div>
            </div>
          </a>
        </div>

        <!-- 資材の各種詳細 -->
        <div class="col-12 col-xl-4">
          <a href="material.html" class="menu-card p-4">
            <div class="d-flex align-items-center h-100">
              <div class="menu-icon green me-4">
                <i class="bi bi-box-seam"></i>
              </div>

              <div class="flex-grow-1">
                <div class="menu-title text-success mb-3">資材の各種詳細</div>
                <div class="menu-desc">
                  資材のサイズ・仕様
                  などを確認できます。
                </div>
              </div>

              <div class="arrow text-success">
                <i class="bi bi-chevron-right"></i>
              </div>
            </div>
          </a>
        </div>

        <!-- 後で追加用 -->
        <div class="col-12 col-xl-4">
          <div class="menu-card p-4">
            <div class="d-flex align-items-center h-100">
              <div class="menu-icon orange me-4">
                <i class="bi bi-list-task"></i>
              </div>

              <div class="flex-grow-1">
                <div class="menu-title text-warning mb-3">その他メニュー</div>
                <div class="menu-desc">
                  今後、各種機能を追加していきます。
                </div>
              </div>

              <div class="arrow text-warning">
                <i class="bi bi-chevron-right"></i>
              </div>
            </div>
          </div>
        </div>

    </section>

    <!-- お知らせ -->
    <section class="notice-card">

      <div class="d-flex align-items-center mb-4">
        <i class="bi bi-bell text-primary fs-3 me-3"></i>
        <h3 class="h4 fw-bold mb-0">お知らせ</h3>
      </div>

      <div id="noticeList"></div>

    </section>

  </main>

  <footer class="footer d-flex justify-content-between">
    <span>&copy; 2026, Created by TSUJIKAWA.</span>
    <span>利用規約　｜　プライバシーポリシー</span>
  </footer>

</body>

</html>
